  
  
     <!DOCTYPE html>
<html>
<head>
    <title>Order Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Order Form</h1>

    <form id="orderForm">
        <input id="name" type="text" placeholder="Customer name">

        <select id="service">
            <option>customer name</option>
            <option>product name</option>
            <option>quantity</option>
            <option>unit price</option>
            <option>member status</option>
            <option>delivery type</option>
        </select>

        <input id="Order" type="number" placeholder="Number of Orders">

    

        <button type="submit">Book</button>
    </form>

    <div id="output"></div>

    <script src="script.js"></script>
</body>
</html>
